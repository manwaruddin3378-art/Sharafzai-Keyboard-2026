name: Build Sharafzai App (optimized APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Prepare permanent app signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/sharafzai-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$HOME/.android/sharafzai-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle :app:assembleRelease

      - name: Report APK size
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $SIZE ($BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sharafzai-App-APK
          path: app/build/outputs/apk/release/app-release.apk
