name: Build Sundus App (test APK)

# Keep only the newest validation run active for each branch.
concurrency:
  group: sundus-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "release/1.8"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Build test APK
        run: gradle :app:assembleDebug

      - name: Report APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          BYTES=$(stat -c%s "$APK")
          echo "Sundus test APK size: $SIZE ($BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')"
          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/sundus-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/sundus-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-sundusrelease}" >/dev/null
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sundus-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-sundusrelease}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Report release signing requirement
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' }}
        run: echo "Release signing is waiting for the private keystore secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Run keyboard smoke test on Android emulator
        timeout-minutes: 35
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # Android 11 uses a lighter system image and is more stable on hosted runners without KVM.
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2 -no-metrics
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set -eux
            adb start-server
            timeout 180s adb wait-for-device

            # Wait inside the emulator shell so the host runner does not split a loop.
            timeout 120s adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "30"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell pm list packages >/dev/null
            adb devices -l

            # Disable the hosted emulator's package-verifier wait, which can time out
            # and reject a valid locally-built APK before instrumentation starts.
            adb shell settings put global package_verifier_enable 0
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_timeout 0

            # Install the actual keyboard APK explicitly before instrumentation.
            # This verifies that PackageManager registers the IME service before tests.
            adb install --no-streaming -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.sharafzai.keyboard
            adb shell dumpsys package com.sharafzai.keyboard | grep -A8 -B4 'KeyboardService' || true
            adb shell cmd package query-services -a android.view.InputMethod || true
            adb shell ime list -a
            # The hosted emulator may expose a hardware keyboard; force the soft IME to show.
            adb shell settings put secure show_ime_with_hard_keyboard 1

            gradle --stop
            timeout 600s gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sharafzai.keyboard.KeyboardSmokeTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-Android-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
