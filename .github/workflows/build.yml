name: Build Sundus App (test APK)

on:
  push:
    branches: [main, "release/1.8"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Run Android lint checks
        run: gradle :app:lintDebug

      # Phase 1 test APK uses Android's automatic debug signing.
      # The permanent private release key remains reserved for production releases.
      - name: Build test APK
        run: gradle :app:assembleDebug

      - name: Report APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          BYTES=$(stat -c%s "$APK")
          echo "Sundus test APK size: $SIZE ($BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Remove whitespace and any clipboard formatting characters before decoding.
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')"
          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/sundus-release.jks"
          # Validate the private keystore and alias before attempting the release build.
          keytool -list -keystore "$RUNNER_TEMP/sundus-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-sundusrelease}" >/dev/null
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sundus-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-sundusrelease}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Report release signing requirement
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' }}
        run: echo "Release signing is waiting for the private keystore secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Run keyboard smoke test on Android emulator
        timeout-minutes: 25
        uses: YevheniiKotyrlo/android-emulator-runner@43c43c242e3a25ac81f0aa3ce8c8324de2fb1aab
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eux
            # Start ADB explicitly and bound every wait so a stalled emulator
            # produces a useful failure instead of hanging the workflow forever.
            adb start-server
            timeout 180s adb wait-for-device

            booted=""
            for attempt in $(seq 1 60); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$booted" = "1" ]; then
                break
              fi
              sleep 5
            done
            if [ "$booted" != "1" ]; then
              echo "Emulator did not finish booting within 5 minutes."
              adb devices -l || true
              exit 1
            fi

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            gradle --stop
            timeout 600s gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-Android-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
