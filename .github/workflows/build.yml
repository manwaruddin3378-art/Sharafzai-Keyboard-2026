name: Build Sundus App (test APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      # Phase 1 test APK uses Android's automatic debug signing.
      # The permanent private release key remains reserved for production releases.
      - name: Build test APK
        run: gradle :app:assembleDebug

      - name: Report APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          BYTES=$(stat -c%s "$APK")
          echo "Sundus test APK size: $SIZE ($BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sundus-release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sundus-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-sharafzai}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sundus-App-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Report release signing requirement
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' }}
        run: echo "Release signing is waiting for the private keystore secrets." >> "$GITHUB_STEP_SUMMARY"

